<svg class="hv-art" viewBox="0 0 620 620" role="img" aria-labelledby="hvTitle hvDesc" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title id="hvTitle">The ShieldLint engine</title>
  <desc id="hvDesc">A robotic shield sentinel scans an orbit of Zcash encodings — ZIP 316, ZIP 321, F4Jumble and Bech32m — and catches a transparent recipient and a leaked viewing key.</desc>
  <defs>
    <radialGradient id="hvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a5bff" stop-opacity=".42"/>
      <stop offset="45%" stop-color="#2a5bff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#2a5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hvGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f9dff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7f9dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hvShield" x1="240" y1="180" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2438"/>
      <stop offset="52%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="hvVisor" x1="250" y1="300" x2="370" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06101f"/>
      <stop offset="50%" stop-color="#0a1a33"/>
      <stop offset="100%" stop-color="#06101f"/>
    </linearGradient>
    <linearGradient id="hvEye" x1="282" y1="0" x2="338" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a5bff"/>
      <stop offset="50%" stop-color="#a8c3ff"/>
      <stop offset="100%" stop-color="#2a5bff"/>
    </linearGradient>
    <linearGradient id="hvBeam" x1="310" y1="150" x2="310" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a5bff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7f9dff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#2a5bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hvTrace" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a5bff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7f9dff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2a5bff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hvGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="hvFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="62%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hvGridMask">
      <rect width="620" height="620" fill="url(#hvFade)"/>
    </mask>
    <clipPath id="hvBeamClip">
      <rect x="196" y="196" width="228" height="250" rx="60"/>
    </clipPath>
    <filter id="hvSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="hvSoft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="620" height="620" fill="url(#hvGrid)" mask="url(#hvGridMask)" opacity=".85"/>
  <circle cx="310" cy="306" r="286" fill="url(#hvGlow)"/>

  <!-- static astronomy -->
  <circle cx="310" cy="310" r="252" stroke="#ffffff" stroke-opacity=".07"/>
  <circle cx="310" cy="310" r="196" stroke="#ffffff" stroke-opacity=".055"/>
  <path d="M310 58v22M310 540v22M58 310h22M540 310h22" stroke="#ffffff" stroke-opacity=".28" stroke-linecap="round"/>

  <!-- rotating orbits -->
  <g class="hv-orbit hv-o1">
    <circle cx="310" cy="310" r="252" stroke="#8fa8ff" stroke-opacity=".28" stroke-dasharray="2 13" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="310" cy="58" r="3.6" fill="#a8c3ff"/>
    <circle cx="310" cy="562" r="2.2" fill="#4f6ea8"/>
  </g>
  <g class="hv-orbit hv-o2">
    <circle cx="310" cy="310" r="196" stroke="#2a5bff" stroke-opacity=".45" stroke-dasharray="54 34" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="310" cy="114" r="4" fill="#7f9dff"/>
    <circle cx="310" cy="114" r="10" stroke="#7f9dff" stroke-opacity=".35"/>
  </g>
  <g class="hv-orbit hv-o3">
    <circle cx="310" cy="310" r="150" stroke="#ffffff" stroke-opacity=".16" stroke-dasharray="1 9" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- orbiting data shards -->
  <g class="hv-shard hv-s1" transform="translate(310 58)">
    <rect x="-11" y="-11" width="22" height="22" rx="6" fill="#0d1420" stroke="#2a5bff" stroke-opacity=".6"/>
    <path d="M-4 -3h8l-8 6h8" stroke="#a8c3ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="hv-shard hv-s2" transform="translate(506 310)">
    <rect x="-11" y="-11" width="22" height="22" rx="6" fill="#0d1420" stroke="#ffffff" stroke-opacity=".2"/>
    <path d="M-3 -4h6v8h-6zM3 0h3" stroke="#8fa8ff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g class="hv-shard hv-s3" transform="translate(310 562)">
    <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#0d1420" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="0" cy="0" r="3" stroke="#f0bd6a" stroke-width="1.2"/>
  </g>

  <!-- circuit traces -->
  <path d="M150 214h44l22 22v38" stroke="url(#hvTrace)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M470 402h-40l-20 20v26" stroke="url(#hvTrace)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="150" cy="214" r="2.4" fill="#7f9dff" opacity=".8"/>
  <circle cx="410" cy="448" r="2.4" fill="#7f9dff" opacity=".7"/>
  <path d="M120 385h36l16 16v22" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.2"/>
  <circle cx="120" cy="385" r="2" fill="#ffffff" opacity=".35"/>

  <!-- base shadow -->
  <ellipse cx="310" cy="486" rx="150" ry="26" fill="#000" opacity=".55" filter="url(#hvSoft)"/>
  <ellipse cx="310" cy="480" rx="104" ry="12" fill="#2a5bff" opacity=".14" filter="url(#hvSoft)"/>

  <!-- antenna -->
  <path d="M310 196v-38" stroke="#8fa8ff" stroke-opacity=".5" stroke-width="1.4"/>
  <circle class="hv-beacon-ring" cx="310" cy="154" r="12" stroke="#7f9dff" stroke-opacity=".45"/>
  <circle cx="310" cy="154" r="4.6" fill="#a8c3ff"/>
  <circle cx="310" cy="154" r="11" fill="#7f9dff" opacity=".18" filter="url(#hvSoft2)"/>

  <!-- ears -->
  <rect x="186" y="286" width="18" height="46" rx="7" fill="#0b111b" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="416" y="286" width="18" height="46" rx="7" fill="#0b111b" stroke="#ffffff" stroke-opacity=".14"/>
  <path d="M195 300v18M425 300v18" stroke="#7f9dff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>

  <!-- shield chassis -->
  <g>
    <path d="M310 186c34 13 64 25 92 36v84c0 57-38 99-92 120-54-21-92-63-92-120v-84c28-11 58-23 92-36Z"
          fill="url(#hvShield)" stroke="#8fa8ff" stroke-opacity=".45" stroke-width="1.3"/>
    <path d="M310 202c29 11 55 22 79 31v73c0 48-32 84-79 103-47-19-79-55-79-103v-73c24-9 50-20 79-31Z"
          stroke="#ffffff" stroke-opacity=".09" stroke-width="1"/>
    <path d="M310 186v-2M218 222v84c0 57 38 99 92 120 54-21 92-63 92-120v-84"
          stroke="#2a5bff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>

    <!-- forehead engraving -->
    <path d="M292 246h36l-36 18h36" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- visor -->
    <rect x="244" y="284" width="132" height="52" rx="26" fill="url(#hvVisor)" stroke="#8fa8ff" stroke-opacity=".5" stroke-width="1.2"/>
    <rect x="250" y="290" width="120" height="40" rx="20" stroke="#2a5bff" stroke-opacity=".22"/>

    <!-- eyes -->
    <g class="hv-eyes">
      <rect x="280" y="304" width="20" height="12" rx="6" fill="url(#hvEye)" filter="url(#hvSoft2)"/>
      <rect x="320" y="304" width="20" height="12" rx="6" fill="url(#hvEye)" filter="url(#hvSoft2)"/>
      <rect x="285" y="307" width="10" height="6" rx="3" fill="#dce7ff"/>
      <rect x="325" y="307" width="10" height="6" rx="3" fill="#dce7ff"/>
    </g>

    <!-- calm smile -->
    <path d="M298 356c8 5 16 5 24 0" stroke="#8fa8ff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>

    <!-- chest status lights -->
    <circle cx="292" cy="390" r="2.6" fill="#35c08a"/>
    <circle cx="310" cy="390" r="2.6" fill="#7f9dff" opacity=".8"/>
    <circle cx="328" cy="390" r="2.6" fill="#ffffff" opacity=".22"/>
    <path d="M256 372h18M346 372h18" stroke="#ffffff" stroke-opacity=".12" stroke-linecap="round"/>

    <!-- edge screws -->
    <circle cx="238" cy="272" r="2" fill="#ffffff" opacity=".2"/>
    <circle cx="382" cy="272" r="2" fill="#ffffff" opacity=".2"/>
    <circle cx="256" cy="428" r="2" fill="#ffffff" opacity=".16"/>
    <circle cx="364" cy="428" r="2" fill="#ffffff" opacity=".16"/>
  </g>

  <!-- scan sweep -->
  <g clip-path="url(#hvBeamClip)">
    <rect class="hv-beam" x="196" y="196" width="228" height="86" fill="url(#hvBeam)"/>
    <path class="hv-beam-line" d="M196 240h228" stroke="#a8c3ff" stroke-opacity=".55" stroke-width="1.2"/>
  </g>

  <!-- caught signals -->
  <g class="hv-catch hv-c1">
    <circle cx="452" cy="216" r="16" stroke="#f0bd6a" stroke-opacity=".55" stroke-dasharray="3 4"/>
    <path d="M447 216h10M452 211v10" stroke="#f0bd6a" stroke-width="1.4" stroke-linecap="round" transform="rotate(45 452 216)"/>
  </g>
  <g class="hv-catch hv-c2">
    <circle cx="158" cy="356" r="13" stroke="#ff8b80" stroke-opacity=".6" stroke-dasharray="3 4"/>
    <path d="M153 351l10 10M163 351l-10 10" stroke="#ff8b80" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- floor HUD -->
  <path d="M200 494c64 26 156 26 220 0" stroke="#ffffff" stroke-opacity=".16" stroke-linecap="round"/>
  <path d="M200 494c64 26 156 26 220 0" stroke="#2a5bff" stroke-opacity=".35" stroke-linecap="round" stroke-dasharray="26 10"/>
</svg>

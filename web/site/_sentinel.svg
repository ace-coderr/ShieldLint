    </filter>
    <filter id="s-b4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="s-drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#04070c" flood-opacity=".6"/>
    </filter>
  </defs>


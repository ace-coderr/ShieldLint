name: shieldlint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit and conformance tests
        run: python -m unittest discover -s tests -t . -v
      - name: Self-lint
        run: shieldlint check shieldlint --no-color
      - name: Clean example stays clean
        run: shieldlint check examples/clean-checkout --no-color
      - name: Vulnerable example is caught
        run: |
          if shieldlint check examples/vulnerable-checkout --no-color --quiet; then
            echo "::error::the vulnerable example produced no findings"
            exit 1
          fi

  sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Produce SARIF
        run: shieldlint check . --format sarif -o shieldlint.sarif --exclude "tests/**" --exclude "examples/vulnerable-checkout/**" || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: shieldlint.sarif
          category: shieldlint

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldlint"
version = "0.1.0"
description = "Offline privacy linting for Zcash software: transparent recipients, memo/key exposure and ZIP 321 validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ShieldLint contributors" }]
keywords = ["zcash", "privacy", "linter", "shielded", "zip-316", "zip-321"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.urls]
"Live Demo" = "https://shieldlint.vercel.app"
Homepage = "https://github.com/ace-coderr/shieldlint"
Repository = "https://github.com/ace-coderr/shieldlint"
Issues = "https://github.com/ace-coderr/shieldlint/issues"
Changelog = "https://github.com/ace-coderr/shieldlint/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shieldlint = "shieldlint.cli:main"

[tool.setuptools.packages.find]
include = ["shieldlint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
